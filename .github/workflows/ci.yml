name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Validate collector
        run: |
          ruff check src tests scripts download.py
          ruff format --check src tests scripts download.py
          pytest
      - name: Generate fictional test data
        run: |
          marketcap demo
          marketcap export --data-dir demo-data
          python scripts/verify_site.py web/public/data
      - name: Build and test browser
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
