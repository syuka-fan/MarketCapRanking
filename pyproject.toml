[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcap-ranking"
version = "0.1.0"
description = "US regular-session closing market-cap rankings and history"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pandas-market-calendars>=5,<6", "yfinance>=1.7,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
marketcap = "marketcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
